name: OSIR Anywhere controlled native upgrade acceptance

# Independent harness only. The original 2.2.1 installer is never rebuilt.
# Baseline preparation creates an explicitly test-only 2.2.0 derivative.
# This is not the published 2.2.0 baseline or historical migration evidence.
on:
  # A reviewed independent branch can call this from an already registered
  # dispatch entry, without moving main to register this new workflow filename.
  workflow_call:
    inputs:
      harness_commit:
        type: string
        required: true
      bindings_json:
        type: string
        required: true
      bindings_sha256:
        type: string
        required: true
      target:
        type: string
        default: all
  workflow_dispatch:
    inputs:
      harness_commit:
        description: Reviewed independent harness full SHA; select this same workflow ref
        type: string
        required: true
      bindings_json:
        description: Same reviewed immutable original artifact bindings as native smoke
        type: string
        required: true
      bindings_sha256:
        description: SHA-256 of exact raw bindings_json bytes
        type: string
        required: true
      target:
        description: All runs Universal on ARM and Intel plus Windows x64
        type: choice
        default: all
        options: [all, darwin-universal, win32-x64, win32-arm64]

permissions:
  contents: read
  actions: read

concurrency:
  group: osir-native-upgrade-${{ inputs.harness_commit }}-${{ inputs.bindings_sha256 }}-${{ inputs.target }}
  cancel-in-progress: false

env:
  OSIR_HARNESS_COMMIT: ${{ inputs.harness_commit }}
  OSIR_ACCEPTANCE_BINDINGS: ${{ inputs.bindings_json }}
  OSIR_ACCEPTANCE_BINDINGS_SHA256: ${{ inputs.bindings_sha256 }}
  OSIR_ACCEPTANCE_TARGET: ${{ inputs.target }}

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      source_commit: ${{ steps.upgrade.outputs.source_commit }}
    defaults:
      run:
        shell: bash
        working-directory: harness
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.harness_commit }}
          path: harness
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - name: Verify original producer jobs, reviewed bindings and archive IDs
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node desktop-workbench/scripts/osir-artifact-acceptance-ci.mjs plan
      - name: Bind additional upgrade harness files to this exact workflow SHA
        id: upgrade
        run: node desktop-workbench/scripts/osir-native-upgrade-acceptance.ci.mjs plan
      - name: Check out only frozen product inputs required by the synthetic discovery test
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.upgrade.outputs.source_commit }}
          path: frozen-test-source
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /osir-source.json
            /desktop-workbench/electron/desktop-updates.ts
            /desktop-workbench/electron/json-store.ts
            /desktop-workbench/electron/update-version.ts
            /desktop-workbench/electron/update-download.ts
            /desktop-workbench/electron/release-manifest.ts
      - name: Install isolated test tools without product install scripts
        run: npm install --prefix "$RUNNER_TEMP/osir-upgrade-test-tools" --ignore-scripts --no-audit --no-fund @electron/asar@3.4.1 typescript@6.0.3
      - name: Focused contracts and synthetic controls (not native acceptance)
        env:
          OSIR_UPGRADE_TEST_SOURCE_ROOT: ${{ github.workspace }}/frozen-test-source
        run: NODE_PATH="$RUNNER_TEMP/osir-upgrade-test-tools/node_modules" node --test desktop-workbench/scripts/osir-native-upgrade-acceptance.test.mjs desktop-workbench/scripts/osir-native-upgrade-acceptance.ci.test.mjs desktop-workbench/scripts/osir-artifact-acceptance-ci.test.mjs
      - uses: actions/upload-artifact@v6
        with:
          name: osir-upgrade-reviewed-bindings-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/osir-artifact-acceptance/reviewed-bindings.json
            ${{ runner.temp }}/osir-artifact-acceptance/producer-evidence.json
            ${{ runner.temp }}/osir-artifact-acceptance/upgrade-harness-provenance.json
          if-no-files-found: error
          retention-days: 30

  prepare-baseline:
    needs: review
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.review.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: harness
    steps:
      - name: Preserve reviewed source bytes on Windows as well
        shell: bash
        working-directory: ${{ github.workspace }}
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.harness_commit }}
          path: harness
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.review.outputs.source_commit }}
          path: frozen-source
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          architecture: ${{ matrix.nodeArch }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: ${{ matrix.nodeArch }}
      - name: Verify exact upgrade harness bytes on this native runner
        run: node desktop-workbench/scripts/osir-native-upgrade-acceptance.ci.mjs verify '${{ matrix.machine }}'
      - uses: actions/download-artifact@v8
        with:
          repository: ousir0/osir-anywhere
          run-id: ${{ matrix.runId }}
          artifact-ids: ${{ matrix.artifactId }}
          github-token: ${{ github.token }}
          skip-decompress: true
          digest-mismatch: error
          path: ${{ runner.temp }}/osir-artifact-acceptance/original-archive
      - name: Verify original archive, installer and receipts
        run: |
          node desktop-workbench/scripts/osir-artifact-acceptance-ci.mjs unpack-product '${{ matrix.machine }}'
          node desktop-workbench/scripts/osir-artifact-acceptance-ci.mjs bind '${{ matrix.machine }}'
      - name: Prepare independent packaging tools (no product dependency install)
        run: |
          npm install --prefix "$RUNNER_TEMP/osir-upgrade-tools" --ignore-scripts --no-audit --no-fund electron-builder@26.18.1 @electron/asar@3.4.1 typescript@6.0.3
          node desktop-workbench/scripts/osir-native-upgrade-acceptance.ci.mjs link-tools '${{ matrix.machine }}'
      - name: Bind frozen source and reuse original shipped compilation for test-only baseline
        env:
          ACCEPTANCE_ROOT: ${{ runner.temp }}/osir-artifact-acceptance
        run: |
          node desktop-workbench/scripts/osir-native-upgrade-acceptance.ci.mjs prepare-spec '${{ matrix.machine }}'
          node desktop-workbench/scripts/osir-native-upgrade-acceptance.mjs prepare-baseline --spec "$ACCEPTANCE_ROOT/prepare-upgrade-spec.json" --output "$ACCEPTANCE_ROOT/baseline"
          node desktop-workbench/scripts/osir-native-upgrade-acceptance.ci.mjs seal-baseline '${{ matrix.machine }}'
      - uses: actions/upload-artifact@v6
        with:
          name: osir-controlled-baseline-${{ matrix.machine }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/osir-artifact-acceptance/baseline-bundle
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Collect preparation evidence without temporary app/source/build trees
        if: always()
        run: node desktop-workbench/scripts/osir-native-upgrade-acceptance.ci.mjs collect-prepare '${{ matrix.machine }}'
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: osir-upgrade-prepare-evidence-${{ matrix.machine }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/osir-artifact-acceptance/prepare-upgrade-evidence
          if-no-files-found: warn
          retention-days: 30

  native-upgrade:
    # Each machine consumes its own successful baseline from a separate clean
    # job. A missing/failed baseline cannot be turned into a passed report.
    needs: [review, prepare-baseline]
    if: always() && needs.review.result == 'success' && !cancelled()
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.review.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: harness
    steps:
      - name: Preserve reviewed harness bytes on Windows
        shell: bash
        working-directory: ${{ github.workspace }}
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.harness_commit }}
          path: harness
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          architecture: ${{ matrix.nodeArch }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: ${{ matrix.nodeArch }}
      - name: Verify upgrade harness bytes on clean native runner
        run: node desktop-workbench/scripts/osir-native-upgrade-acceptance.ci.mjs verify '${{ matrix.machine }}'
      - uses: actions/download-artifact@v8
        with:
          repository: ousir0/osir-anywhere
          run-id: ${{ matrix.runId }}
          artifact-ids: ${{ matrix.artifactId }}
          github-token: ${{ github.token }}
          skip-decompress: true
          digest-mismatch: error
          path: ${{ runner.temp }}/osir-artifact-acceptance/original-archive
      - name: Bind same immutable final installer again
        run: |
          node desktop-workbench/scripts/osir-artifact-acceptance-ci.mjs unpack-product '${{ matrix.machine }}'
          node desktop-workbench/scripts/osir-artifact-acceptance-ci.mjs bind '${{ matrix.machine }}'
      - uses: actions/download-artifact@v8
        with:
          name: osir-controlled-baseline-${{ matrix.machine }}-${{ github.run_id }}-${{ github.run_attempt }}
          digest-mismatch: error
          path: ${{ runner.temp }}/osir-artifact-acceptance/baseline-bundle
      - name: Verify prepared baseline transfer, then run real installer/data/discovery acceptance
        env:
          ACCEPTANCE_ROOT: ${{ runner.temp }}/osir-artifact-acceptance
        run: |
          node desktop-workbench/scripts/osir-native-upgrade-acceptance.ci.mjs run-spec '${{ matrix.machine }}'
          node desktop-workbench/scripts/osir-native-upgrade-acceptance.mjs run --spec "$ACCEPTANCE_ROOT/run-upgrade-spec.json" --output "$ACCEPTANCE_ROOT/upgrade"
      - name: Preserve actual reports, requests, data observations and failure evidence
        if: always()
        run: node desktop-workbench/scripts/osir-native-upgrade-acceptance.ci.mjs collect-run '${{ matrix.machine }}'
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: osir-native-upgrade-evidence-${{ matrix.machine }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/osir-artifact-acceptance/run-upgrade-evidence
          if-no-files-found: warn
          retention-days: 30
