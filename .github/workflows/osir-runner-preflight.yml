name: OSIR native runner preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin
            arch: arm64
          - runner: macos-15-intel
            platform: darwin
            arch: x64
          - runner: windows-2022
            platform: win32
            arch: x64
          - runner: windows-11-arm
            platform: win32
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - name: Verify native process identity
        env:
          EXPECTED_PLATFORM: ${{ matrix.platform }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: >-
          node -e "const a=require('node:assert/strict');
          a.equal(process.platform,process.env.EXPECTED_PLATFORM);
          a.equal(process.arch,process.env.EXPECTED_ARCH);
          console.log(JSON.stringify({platform:process.platform,arch:process.arch,node:process.version,runner:process.env.RUNNER_OS,image:process.env.ImageOS}));"
