[project]
name = "agent-server"
version = "2.2.0"
description = "FastAPI backend for Agents Anywhere"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16.0",
    "asyncpg>=0.30.0",
    "claude-agent-sdk",
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "httpx-s3-client",
    "jsonschema>=4.26.0",
    "loguru>=0.7.3",
    "PyJWT[crypto]>=2.10.1,<3",
    "python-multipart>=0.0.20",
    "redis>=6.0.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "uvicorn>=0.47.0",
    "websockets>=16.0",
    "wsproto>=1.3.2",
]

[dependency-groups]
dev = [
    "fakeredis[lua]>=2.30.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.2",
    "pytest>=9.0.3",
    "ruff>=0.15.13",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv.sources]
httpx-s3-client = { path = "../.local-dev/vendor/httpx-s3-client-2a7fe15c74a2f9d1cd38b0ef48b1faa9b61952b3" }
